<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험지 인쇄 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@cantoo/pdf-lib@2.11.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e3e6eb; --text:#1d2330; --sub:#6b7383;
  --blue:#2f6fed; --blue-bg:#eaf1ff; --green:#14894a; --green-bg:#e6f6ec;
  --amber:#a76200; --amber-bg:#fff3dc; --red:#c62f2f; --red-bg:#fdeaea;
  --gray-bg:#eef0f3; --today:#fffbe6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:7px;padding:6px 11px}
button:hover{background:#f2f4f7}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#245ed1}
button.danger{color:var(--red)}
button.sm{padding:3px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;color:var(--text)}
textarea{width:100%;resize:vertical}

header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;font-weight:700}
.agent{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--gray-bg);color:var(--sub)}
.agent.on{background:var(--green-bg);color:var(--green)}
.agent.off{background:var(--red-bg);color:var(--red)}
.spacer{flex:1}
.admin-on{background:var(--amber-bg);border-color:#f0d39a;color:var(--amber)}

main{max-width:1280px;margin:0 auto;padding:16px 20px 60px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{padding:9px 22px;border-radius:9px 9px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--gray-bg);font-weight:500;color:var(--sub)}
.tab.active{background:#fff;color:var(--text);font-weight:700}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}

.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1050px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f8f9fb;font-size:12px;color:var(--sub);font-weight:500;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
tr.today td{background:var(--today)}
tr.done td{color:#9aa1ad}
td.date{white-space:nowrap;font-variant-numeric:tabular-nums}
td.c{text-align:center}
.chip-c{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.5}
.color-row{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.color-row input[type=color]{flex:0 0 32px;width:32px;height:30px;padding:2px;border-radius:7px;cursor:pointer;background:#fff}
.color-row input[type=text]{flex:1;min-width:0;padding:5px 8px;font-size:13px}
.color-row .icon-btn{flex:0 0 auto}
.color-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.st-신청{background:var(--blue-bg);color:var(--blue)}
.st-인쇄중{background:var(--amber-bg);color:var(--amber)}
.st-준비완료{background:var(--green-bg);color:var(--green)}
.st-진행완료{background:var(--gray-bg);color:var(--sub)}
.st-오류{background:var(--red-bg);color:var(--red)}
.file{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--gray-bg);color:#9aa1ad;margin-right:3px}
.file.has{background:#e9e4ff;color:#5a3fd1}
.actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.icon-btn{border:none;background:none;padding:2px 5px;font-size:13px;margin-left:auto;opacity:.6}
.icon-btn:hover{background:var(--gray-bg);opacity:1}
.chip{display:inline-block;margin:0 4px 4px 0}
.bulk-table select,.bulk-table input{width:100%;padding:4px 6px;font-size:12px}
.bulk-table td{font-size:12px}
.empty{padding:40px;text-align:center;color:var(--sub)}

.jobs{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.jobs h3{margin:0 0 8px;font-size:14px}
.job{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.job:last-child{border-bottom:none}
.job .t{color:var(--sub);font-size:12px;width:90px;flex-shrink:0}
.job .what{flex:1}
.j-대기{background:var(--blue-bg);color:var(--blue)}
.j-인쇄중{background:var(--amber-bg);color:var(--amber)}
.j-완료{background:var(--green-bg);color:var(--green)}
.j-오류{background:var(--red-bg);color:var(--red)}

.modal-bg{position:fixed;inset:0;background:rgba(20,25,35,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:20px}
.modal.wide{max-width:720px}
.modal h2{margin:0 0 4px;font-size:17px}
.modal .desc{color:var(--sub);font-size:13px;margin-bottom:14px}
.form{display:grid;grid-template-columns:90px 1fr;gap:9px 10px;align-items:center}
.form label{font-size:13px;color:var(--sub)}
.form input,.form select{width:100%}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.upload-box{border:1px dashed var(--line);border-radius:9px;padding:12px;margin-bottom:10px}
.upload-box b{display:block;margin-bottom:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222a38;color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;z-index:30;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
.sem-table{width:100%;min-width:0;border-collapse:collapse;margin-top:6px}
.sem-table td,.sem-table th{padding:4px;border-bottom:none}
.sem-table input{width:100%;padding:5px 7px;font-size:13px}
.sem-sec{margin-top:16px}
.sem-sec h4{margin:0 0 4px;font-size:14px}
select:disabled{background:#f4f5f7;color:#9aa1ad}
</style>
</head>
<body>

<header>
  <h1>📄 시험지 인쇄 관리</h1>
  <span class="spacer"></span>
  <select id="semSel" onchange="setSem(this.value)" title="학기 선택"></select>
  <button id="adminBtn" onclick="toggleAdmin()">🔒 관리자</button>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-cat="munin" onclick="setTab('munin')">문인시</button>
    <button class="tab" data-cat="chat" onclick="setTab('chat')">CHAT</button>
  </div>

  <div class="toolbar">
    <button class="primary" onclick="openEdit()">＋ 시험 신청</button>
    <input id="search" placeholder="담임·레벨·교재 검색" oninput="render()" style="width:200px">
    <label><input type="checkbox" id="hideDone" checked onchange="render()"> 진행완료 숨기기</label>
    <span class="spacer"></span>
    <span id="adminTools" style="display:none;gap:6px">
      <button onclick="openLibrary()">📚 시험지 보관함</button>
      <button onclick="openColors()">🎨 색 설정</button>
      <button onclick="openSemesters(currentSem()?currentSem().id:null)">학기 설정</button>
      <button onclick="openImport()">시트에서 붙여넣기</button>
      <button onclick="openChangePw()">비번 변경</button>
    </span>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th class="sortable" onclick="toggleSort()">날짜 <span id="sortIcon">▲</span></th>
        <th>담임</th><th>레벨</th><th id="bookHead">문법교재</th><th>Lesson</th>
        <th>시간대</th><th>인원</th><th>요청</th><th>기타 참조</th><th>시험지</th><th>작업</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// ====== 설정: 기존 Supabase 프로젝트 정보 입력 ======
const SUPABASE_URL = 'https://utidzfdezgjgyawjfnnd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0aWR6ZmRlemdqZ3lhd2pmbm5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMjEzNDYsImV4cCI6MjEwNDY5NzM0Nn0.Qx9mcGc6VI54Vit6T5nzATAsCJXhj5qIYd0A8fqoOwo';
// ===================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const STATUSES = ['신청','일정변경','준비완료','진행완료'];
const CAT_LABEL = {chat:'CHAT', munin:'문인시'};
const BOOK_LABEL = {chat:'Story Book', munin:'문법교재'};

let tab = 'munin';
let papers = [];
let adminPw = null;     // 확인된 관리자 비번 (새로고침하면 사라짐)
let taPw = null;        // 확인된 조교 비번 (새로고침하면 사라짐)
let sortAsc = true;
let semesters = [], classes = [], levelBooks = [];
let library = [];       // 시험지 보관함 (교재·레슨·본/재)
let semId = null;       // 선택된 학기 id ('all' = 전체 기간)

// ---------- 유틸 ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
function toast(msg, err){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',2600); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseCopies(h){ const nums=String(h||'').match(/\d+/g); return nums ? nums.reduce((a,b)=>a+Number(b),0) : 0; }
function fmtTime(t){ if(!t) return ''; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function errMsg(e){ return (e && (e.message || e.error_description)) || String(e); }

// ---------- 데이터 ----------
async function loadPapers(){
  const { data, error } = await sb.from('exam_papers').select('*');
  if(error){ toast('목록 불러오기 실패: '+errMsg(error), true); return; }
  papers = data || [];
  render();
}

// ---------- PDF 만들기 · 인쇄창 ----------
const MM = 72/25.4;           // mm → pt
const B5_W = 182*MM;          // B5 가로 (이름 위치 비율 기준)
function b64ToBytes(b64){ const s=atob(b64.replace(/\s/g,'')); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
function bytesToB64(buf){ const a=new Uint8Array(buf); let s=''; for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null, a.subarray(i,i+0x8000)); return btoa(s); }
// 이름을 그림(PNG)으로 만들어서 붙임 → 한글 글꼴 따로 필요 없음
function nameToPng(name, sizePt){
  const px = sizePt*4, c=document.createElement('canvas'), g=c.getContext('2d');
  const font = `bold ${px}px 'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif`;
  g.font = font; const w = Math.ceil(g.measureText(name).width)+8;
  c.width = w; c.height = Math.ceil(px*1.35);
  g.font = font; g.fillStyle = '#000'; g.textBaseline = 'top'; g.fillText(name, 4, px*0.12);
  return { data: c.toDataURL('image/png'), w: c.width, h: c.height };
}
// sets: 부수만큼의 배열. 각 칸이 null이면 그냥, 이름이면 첫 장에 이름 찍음
async function buildPdf(srcBytes, sets, pos){
  const { PDFDocument } = PDFLib;
  const src = await PDFDocument.load(srcBytes);
  const out = await PDFDocument.create();
  const n = src.getPageCount();
  for(const name of sets){
    const pages = await out.copyPages(src, src.getPageIndices());
    for(let i=0;i<pages.length;i++){
      const pg = out.addPage(pages[i]);
      if(i===0 && name){
        const { width, height } = pg.getSize(), scale = width / B5_W;
        const img = nameToPng(name, pos.size), png = await out.embedPng(img.data);
        const h = pos.size*1.35*scale, w = h * img.w / img.h;
        pg.drawImage(png, { x: pos.x*MM*scale, y: height - pos.y*MM*scale - h, width: w, height: h });
      }
    }
    // 양면이라 홀수 쪽이면 빈 면을 넣어서 다음 부가 새 종이에서 시작되게
    if(n % 2 === 1){ const { width, height } = pages[n-1].getSize(); out.addPage([width, height]); }
  }
  return out.save();
}
// 브라우저 인쇄창 열기
function printPdf(bytes){
  const url = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));
  let f = $('printFrame'); if(f) f.remove();
  f = document.createElement('iframe'); f.id = 'printFrame';
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
  f.onload = () => { setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ window.open(url); } }, 300); };
  f.src = url; document.body.appendChild(f);
}
function libPos(l){ return { x:Number(l.name_x), y:Number(l.name_y), size:Number(l.name_size) }; }

// ---------- 시험지 보관함 ----------
async function loadLibrary(){
  const { data, error } = await sb.from('exam_library').select('*').order('book').order('sort_order').order('id');
  if(error){ toast('보관함 불러오기 실패: '+errMsg(error), true); return; }
  library = data || [];
  render();
}
function libById(id){ return id ? library.find(l=>l.id===id) : null; }
function libBooks(cat){ return [...new Set(library.filter(l=>l.category===cat).map(l=>l.book))].sort((a,b)=>a.localeCompare(b,'ko',{numeric:true})); }
// 레슨은 숫자 순서대로 (Chapter 1-3, 4-5, 6-7, 8-10 …) — 올린 순서와 상관없이
function libLessons(cat, book){
  return library.filter(l=>l.category===cat && l.book===book && l.lesson!=='')   // 빈 레슨 = 교재 자리표시
    .sort((a,b)=>a.lesson.localeCompare(b.lesson, 'ko', {numeric:true, sensitivity:'base'}));
}
function libFind(cat, book, lesson){ return lesson ? (library.find(l=>l.category===cat && l.book===book && l.lesson===lesson) || null) : null; }
// CHAT은 레슨 없이 교재(시험) 하나 = 시험지 하나. 문인시는 교재+챕터
const BOOK_ONLY = cat => cat === 'chat';
function bookRow(cat, book){ return book ? (library.find(l=>l.category===cat && l.book===book && l.lesson==='') || null) : null; }
// 레벨 비교: 'LSA1(1-3개월)' → 'LSA1', 대소문자·띄어쓰기 무시
const normLv = s => String(s||'').replace(/[\(\[（].*$/,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function bookLevels(cat, book){ const r = bookRow(cat, book); return r && r.level ? r.level.split(',').map(normLv).filter(Boolean) : []; }
function comboLevel(a, b){ return [...new Set([...bookLevels('chat',a), ...bookLevels('chat',b)])].join(',') || null; }
function libFor(cat, book, lesson){ return BOOK_ONLY(cat) ? bookRow(cat, book) : libFind(cat, book, lesson); }

// ---------- 학기 ----------
// ---------- 색 (담임·시간대·요청) ----------
let colors = [];
async function loadColors(){
  const { data, error } = await sb.from('exam_colors').select('*').order('kind').order('sort_order');
  if(error) return;               // 색 표가 아직 없으면 그냥 기본 모양
  colors = data || []; render();
}
const normC = s => String(s||'').toLowerCase().replace(/\s+/g,'');
// 'Christine양희수' → Christine 색, '월수금1부' → 월수금1 색 (앞부분이 같으면 같은 색, 가장 길게 맞는 것)
function colorFor(kind, v){
  const n = normC(v); if(!n) return null;
  let best = null;
  for(const c of colors) if(c.kind===kind){ const k = normC(c.name); if(k && n.startsWith(k) && (!best || k.length > normC(best.name).length)) best = c; }
  return best ? best.color : null;
}
// 배경이 어두우면 흰 글씨
function textOn(hex){ const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||''); if(!m) return '#1d2330';
  const [r,g,b]=[1,2,3].map(i=>parseInt(m[i],16)); return (r*299+g*587+b*114)/1000 < 150 ? '#fff' : '#1d2330'; }
function chip(kind, v){ const c = colorFor(kind, v); return c && v ? `<span class="chip-c" style="background:${c};color:${textOn(c)}">${esc(v)}</span>` : esc(v); }

// 색 설정 화면 (관리자)
const COLOR_KINDS = [['teacher','담임'],['slot','시간대'],['status','요청']];
const PALETTE = ['#fde9a6','#e6d3f5','#c6e0f5','#fbd0cf','#d4edbc','#c9dbe3','#fcc994','#fdf3a7','#f6a04d','#3d7ee8','#11734b','#b10202','#5b3c88','#0a53a8'];
let cdraft = null;
function openColors(){
  cdraft = {}; COLOR_KINDS.forEach(([k])=>cdraft[k] = colors.filter(c=>c.kind===k).map(c=>({name:c.name, color:c.color})));
  if(!cdraft.status.length) cdraft.status = STATUSES.map((n,i)=>({name:n, color:PALETTE[i]}));
  renderColors();
}
function renderColors(){
  showModal(`
    <h2>🎨 색 설정</h2>
    <div class="desc">목록에서 담임·시간대·요청 칸이 이 색으로 보여요. 이름 앞부분이 같으면 같은 색이에요 (예: <b>Christine</b> → 'Christine양희수'도 같은 색).</div>
    <div class="color-cols">${COLOR_KINDS.map(([k,label])=>`<div>
      <b style="font-size:14px">${label}</b>
      <div style="margin-top:6px">${cdraft[k].map((c,i)=>`<div class="color-row">
        <input type="color" value="${esc(c.color)}" oninput="cdraft.${k}[${i}].color=this.value;this.nextElementSibling.style.background=this.value;this.nextElementSibling.style.color=textOn(this.value)">
        <input type="text" value="${esc(c.name)}" oninput="cdraft.${k}[${i}].name=this.value" style="background:${esc(c.color)};color:${textOn(c.color)}" ${k==='status'?'readonly':''}>
        ${k==='status'?'':`<button class="icon-btn" style="margin:0" title="지우기" onclick="cdraft.${k}.splice(${i},1);renderColors()">🗑</button>`}
      </div>`).join('')}</div>
      ${k==='status'?'':`<div style="display:flex;gap:4px;margin-top:4px">
        <button class="sm" onclick="addColor('${k}')">＋ 추가</button>
        <button class="sm" onclick="fillColors('${k}')" title="반현황에 있는데 색이 없는 것 추가">반현황에서 채우기</button></div>`}
    </div>`).join('')}</div>
    <div class="btns"><button onclick="closeModal()">취소</button><button class="primary" onclick="saveColors()">저장</button></div>`, true);
}
function nextColor(k){ const used = new Set(cdraft[k].map(c=>c.color)); return PALETTE.find(c=>!used.has(c)) || PALETTE[cdraft[k].length % PALETTE.length]; }
function addColor(k){ cdraft[k].push({name:'', color:nextColor(k)}); renderColors(); }
function fillColors(k){
  const src = [...new Set(classes.map(c=>k==='teacher'?c.teacher:c.timeslot).filter(Boolean))].sort();
  let n = 0;
  for(const v of src) if(!cdraft[k].some(c=>c.name && normC(v).startsWith(normC(c.name)))){ cdraft[k].push({name:v, color:nextColor(k)}); n++; }
  renderColors(); toast(n ? `${n}개 추가했어요` : '빠진 게 없어요');
}
async function saveColors(){
  const items = [];
  COLOR_KINDS.forEach(([k])=>cdraft[k].forEach((c,i)=>{ if(c.name.trim()) items.push({kind:k, name:c.name.trim(), color:c.color, ord:i+1}); }));
  const { error } = await sb.rpc('exam_save_colors', {p_pw:adminPw, p_items:items});
  if(error) return toast('저장 실패: '+errMsg(error), true);
  closeModal(); toast('색 저장'); loadColors();
}

async function loadSettings(){
  const [s, c, b] = await Promise.all([
    sb.from('exam_semesters').select('*').order('start_date',{ascending:false}),
    sb.from('exam_classes').select('*'),
    sb.from('exam_level_books').select('*')
  ]);
  if(s.error){ toast('학기 불러오기 실패: '+errMsg(s.error), true); return; }
  semesters = s.data || []; classes = c.data || []; levelBooks = b.data || [];
  if(semId===null || (semId!=='all' && !semesters.some(x=>x.id===semId))){
    const t = todayStr();
    const cur = semesters.find(x=>x.start_date<=t && t<=x.end_date) || semesters[0];
    semId = cur ? cur.id : 'all';
  }
  $('semSel').innerHTML = semesters.map(x=>`<option value="${x.id}" ${x.id===semId?'selected':''}>${esc(x.name)}</option>`).join('')
    + `<option value="all" ${semId==='all'?'selected':''}>전체 기간</option>`;
  render();
}
function setSem(v){ semId = v==='all' ? 'all' : Number(v); render(); }
function currentSem(){ return semId==='all' ? null : semesters.find(x=>x.id===semId) || null; }
// 날짜가 속한 학기 (없으면 위에서 선택한 학기)
function semFor(date){ return (date && semesters.find(x=>x.start_date<=date && date<=x.end_date)) || currentSem(); }

// ---------- 화면 ----------
function setTab(c){
  tab = c;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.cat===c));
  $('bookHead').textContent = BOOK_LABEL[c];
  render();
}
function toggleSort(){ sortAsc = !sortAsc; $('sortIcon').textContent = sortAsc ? '▲' : '▼'; render(); }

function render(){
  const q = $('search').value.trim().toLowerCase();
  const hide = $('hideDone').checked;
  const today = todayStr();
  let rows = papers.filter(p => p.category === tab);
  const sem = currentSem();
  if(sem) rows = rows.filter(p => p.exam_date && p.exam_date >= sem.start_date && p.exam_date <= sem.end_date);
  if(hide) rows = rows.filter(p => p.status !== '진행완료');
  if(q) rows = rows.filter(p => [p.teacher,p.level,p.book,p.lesson,p.timeslot,p.note].join(' ').toLowerCase().includes(q));
  rows.sort((a,b)=>{
    const da=a.exam_date||'9999', db=b.exam_date||'9999';
    if(da!==db) return sortAsc ? da.localeCompare(db) : db.localeCompare(da);
    return (a.teacher||'').localeCompare(b.teacher||'') || (a.timeslot||'').localeCompare(b.timeslot||'') || a.id-b.id;
  });

  if(!rows.length){ $('tbody').innerHTML = `<tr><td colspan="11" class="empty">표시할 시험이 없어요</td></tr>`; return; }

  $('tbody').innerHTML = rows.map(p=>{
    const cls = [p.exam_date===today?'today':'', p.status==='진행완료'?'done':''].join(' ');
    const copies = parseCopies(p.headcount);
    const lib = libById(p.library_id);
    let act = '';
    // 순서: 본시 인쇄(관리자) → 재시 인쇄 → 진행완료
    if(adminPw){
      act += `<button class="sm primary" ${lib&&lib.main_file?'':'disabled title="보관함에 본시험지가 없어요"'} onclick="openPrint(${p.id})">🖨 본시${copies?` ${copies}부`:''}</button>`;
    }
    if(lib && lib.retest_file) act += `<button class="sm" onclick="openRetest(${p.id})">🖨 재시</button>`;
    if(p.status==='준비완료') act += `<button class="sm" onclick="markDone(${p.id})">진행완료</button>`;
    act += `<button class="icon-btn" title="수정" onclick="openEdit(${p.id})">✏️</button>`;
    return `<tr class="${cls}">
      <td class="date">${esc(p.exam_date||'-')}</td>
      <td>${chip('teacher', p.teacher)}</td><td>${esc(p.level)}</td><td>${esc(p.book)}</td>
      <td>${esc(p.lesson)}</td><td>${chip('slot', p.timeslot)}</td><td class="c">${esc(p.headcount)}</td>
      <td>${colorFor('status', p.status) ? chip('status', p.status) : `<span class="badge st-${esc(p.status)}">${esc(p.status)}</span>`}</td>
      <td style="max-width:180px">${esc(p.note)}</td>
      <td>${lib ? `<span class="file ${lib.main_file?'has':''}">본</span><span class="file ${lib.retest_file?'has':''}">재</span>`
                : `<span class="file" title="보관함 레슨과 연결되지 않았어요. ✏️에서 레슨을 다시 고르세요" style="color:var(--amber)">⚠ 미연결</span>`}</td>
      <td><div class="actions">${act}</div></td>
    </tr>`;
  }).join('');
}

// --- 담임 → 레벨 → 시간대/교재 연동 ---
function fval(id){ const e=$(id); return e ? e.value.trim() : ''; }
function semClassesFor(){ const s=semFor(fval('f_date')); return s ? classes.filter(c=>c.semester_id===s.id) : []; }
function semBooksFor(){ const s=semFor(fval('f_date')); return s ? Object.fromEntries(levelBooks.filter(b=>b.semester_id===s.id).map(b=>[b.level,b.book])) : {}; }
// 선택지가 있으면 드롭다운(+직접 입력), 없으면 입력칸
function pickHTML(id, options, value, onchg, noCustom){
  if(!options.length) return `<input id="${id}" value="${esc(value)}" onchange="${onchg}">`;
  const opts=[...options]; if(value && !opts.includes(value)) opts.unshift(value);
  return `<select id="${id}" onchange="if(this.value==='__c'){toCustom('${id}','${onchg}')}else{${onchg}}">
    <option value="">선택</option>${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}
    ${noCustom?'':'<option value="__c">직접 입력…</option>'}</select>`;
}
// 교재: 보관함 교재 + (문인시) 학기 레벨 교재
function buildBook(value, showAll){
  let list = libBooks(editCat);
  if(editCat==='munin') list = [...new Set([...list, ...Object.values(semBooksFor())])].sort((a,b)=>a.localeCompare(b,'ko',{numeric:true}));
  let note = '';
  const lv = normLv(fval('f_level'));
  if(BOOK_ONLY(editCat) && lv && !showAll){
    const mine = list.filter(b=>bookLevels(editCat, b).includes(lv));
    if(mine.length){
      list = mine;                                            // (이미 골라둔 교재는 pickHTML이 맨 위에 남겨둠)
      note = `<div class="hint" style="margin-top:3px">${esc(fval('f_level'))} 교재만 보여요 · <a href="#" onclick="buildBook(fval('f_book'),true);return false">전체 교재 보기</a></div>`;
    }
  }
  $('w_book').innerHTML = pickHTML('f_book', list, value, 'onBook()') + note;
}
// Chapter/Lesson: 보관함에 등록된 레슨만 드롭다운 (철자가 항상 같아서 시험지와 정확히 연결됨)
function buildLesson(value){
  const book = fval('f_book');
  if(BOOK_ONLY(editCat)){
    // CHAT: 레슨은 메모용 자유 입력. 시험지는 교재로 연결
    const ok = bookRow(editCat, book);
    $('w_lesson').innerHTML = `<input id="f_lesson" value="${esc(value)}" placeholder="예: 13-14 (메모)">`
      + (book && !ok ? `<div class="hint" style="margin-top:3px">이 교재는 보관함에 없어서 시험지가 연결되지 않아요.</div>` : '');
    return;
  }
  const list = libLessons(editCat, book).map(l=>l.lesson);
  if(!book && !value){ $('w_lesson').innerHTML = waitHTML('f_lesson', '교재 먼저 선택'); return; }
  if(!list.length){
    $('w_lesson').innerHTML = `<input id="f_lesson" value="${esc(value)}" placeholder="보관함에 없는 교재 — 직접 입력">`
      + `<div class="hint" style="margin-top:3px">이 교재는 보관함에 레슨이 없어서 시험지가 연결되지 않아요. 관리자에게 등록을 요청하세요.</div>`;
    return;
  }
  $('w_lesson').innerHTML = pickHTML('f_lesson', list, value, '', true);
}
function onBook(){ buildLesson(''); }
function toCustom(id, onchg){ $(id).outerHTML=`<input id="${id}" onchange="${onchg}" placeholder="직접 입력">`; $(id).focus(); }
function waitHTML(id, msg){ return `<select id="${id}" disabled><option value="">${msg}</option></select>`; }

function buildTeacher(value){
  const list=[...new Set(semClassesFor().map(c=>c.teacher))].sort();
  $('w_teacher').innerHTML = pickHTML('f_teacher', list, value, 'onTeacher()');
}
function buildLevel(value, autoBook){
  const all=semClassesFor(), t=fval('f_teacher');
  const list=[...new Set(all.filter(c=>c.teacher===t).map(c=>c.level))].sort();
  if(all.length && !t && !value){ $('w_level').innerHTML = waitHTML('f_level','담임 먼저 선택'); return; }
  if(!value && list.length===1) value=list[0];            // 맡은 레벨이 하나면 바로 선택
  $('w_level').innerHTML = pickHTML('f_level', list, value, 'onLevel()');
  if(autoBook) fillBook();
}
function buildSlot(value){
  const all=semClassesFor(), t=fval('f_teacher'), l=fval('f_level');
  const slots=[...new Set(all.filter(c=>c.teacher===t && c.level===l).map(c=>c.timeslot).filter(Boolean))];
  if(all.length && !l && !value){ $('w_slot').innerHTML = waitHTML('f_slot','레벨 먼저 선택'); return; }
  if(slots.length===1) $('w_slot').innerHTML = `<input id="f_slot" value="${esc(value||slots[0])}">`;  // 1개면 자동기입
  else $('w_slot').innerHTML = pickHTML('f_slot', slots, value, '');                                  // 2개 이상이면 선택
}
function fillBook(){
  if(BOOK_ONLY(editCat)){
    // CHAT: 레벨을 바꾸면 그 레벨 교재만. 다른 레벨 교재가 골라져 있었으면 비움
    const b=fval('f_book'), lv=normLv(fval('f_level'));
    const hasAny = libBooks(editCat).some(x=>bookLevels(editCat,x).includes(lv));
    const keep = !b || !hasAny || bookLevels(editCat,b).includes(lv);
    buildBook(keep?b:''); if(!keep) buildLesson('');
    return;
  }
  const b=semBooksFor()[fval('f_level')];
  if(b){ buildBook(b); buildLesson(''); }
}
function onTeacher(){ buildLevel('', true); buildSlot(''); }
function onLevel(){ fillBook(); buildSlot(''); }
function onDate(){ const t=fval('f_teacher'), l=fval('f_level'), s=fval('f_slot'), b=fval('f_book'), ls=fval('f_lesson'); buildTeacher(t); buildBook(b); buildLesson(ls); buildLevel(l); buildSlot(s); }

// 재시험 명단 → 인쇄 (조교샘)
function openRetest(id){
  const p = papers.find(x=>x.id===id);
  showModal(`
    <h2>재시험지 인쇄</h2>
    <div class="desc">${esc(p.exam_date)} · ${esc(p.teacher)} · ${esc(p.level)} · ${esc(p.book)}</div>
    ${(taPw||adminPw)?'':`<div class="form" style="margin-bottom:10px"><label>🔒 조교 비번</label><input type="password" id="r_pw" placeholder="조교샘 비밀번호"></div>`}
    <textarea id="r_names" rows="8" placeholder="재시 대상자 이름을 한 줄에 한 명씩 (또는 쉼표로 구분)"></textarea>
    <div class="hint">이름이 시험지에 찍혀서 한 명당 한 부씩 인쇄창이 열려요. 인쇄창에서 용지 B5 · 양면을 확인하세요. <span id="r_count"></span></div>
    <div class="btns"><button onclick="closeModal()">취소</button><button class="primary" onclick="sendRetest(${id})">🖨 인쇄</button></div>`);
  if($('r_pw')) $('r_pw').focus();
  const ta=$('r_names'); ta.oninput=()=>{ $('r_count').textContent = splitNames(ta.value).length ? `(${splitNames(ta.value).length}명)` : ''; };
}
function splitNames(t){ return t.split(/[\n,，]+/).map(s=>s.trim()).filter(Boolean); }
async function sendRetest(id){
  const names = splitNames($('r_names').value);
  if(!names.length) return toast('이름을 입력해 주세요', true);
  const lib = libById(papers.find(x=>x.id===id).library_id);
  if(!lib || !lib.retest_file) return toast('보관함에 재시험지가 없어요', true);
  const pw = taPw || adminPw || ($('r_pw') ? $('r_pw').value : '');
  if(!pw) return toast('조교 비밀번호를 입력해 주세요', true);
  toast('재시험지 준비 중…');
  const { data, error } = await sb.rpc('exam_get_retest', {p_pw:pw, p_lib:lib.id});
  if(error){
    if(/비밀번호/.test(errMsg(error))){ taPw = null; if($('r_pw')) $('r_pw').value=''; return toast('조교 비밀번호가 틀렸어요', true); }
    return toast('불러오기 실패: '+errMsg(error), true);
  }
  if(!adminPw) taPw = pw;          // 맞았으면 새로고침 전까지 다시 안 물어봄
  try{
    const pdf = await buildPdf(b64ToBytes(data), names, libPos(lib));
    closeModal(); printPdf(pdf);
  }catch(e){ toast('PDF 만들기 실패: '+errMsg(e), true); }
}

async function changePw(){

// --- 반현황 엑셀 불러오기 ---
let xl = null;   // {wb, sheet, rows, hdr, map:{teacher,level,slot,slot2,book}, strip}
const XL_GUESS = {
  teacher: /담임|선생|강사|teacher/i,
  level:   /레벨|level|반명|^반$|클래스|class/i,
  slot:    /시간대|요일|time|시간/i,
  slot2:   /교시|타임|period/i,
  book:    /문법|교재|book/i
};
async function readClassExcel(file){
  if(!file) return;
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    xl = { wb, sheet: wb.SheetNames[0], strip:false };
    loadXlSheet();
  }catch(e){ toast('엑셀 읽기 실패: '+errMsg(e), true); }
}
function loadXlSheet(){
  const rows = XLSX.utils.sheet_to_json(xl.wb.Sheets[xl.sheet], {header:1, defval:'', raw:false})
    .map(r=>r.map(c=>String(c??'').replace(/​/g,'').trim()));
  // 머리글 줄 찾기: 위쪽 15줄 중 '담임' 같은 글자가 있는 줄
  let hdr = rows.slice(0,15).findIndex(r=>r.some(c=>XL_GUESS.teacher.test(c)));
  if(hdr < 0) hdr = 0;
  const head = rows[hdr] || [];
  const guess = k => { const i = head.findIndex((c,j)=>XL_GUESS[k].test(c) && !(k!=='teacher' && XL_GUESS.teacher.test(c))); return i; };
  const map = { teacher:guess('teacher'), level:guess('level'), slot:guess('slot'), slot2:-1, book:guess('book') };
  const s2 = head.findIndex((c,j)=>XL_GUESS.slot2.test(c) && j!==map.slot); if(s2>=0) map.slot2 = s2;
  Object.assign(xl, { rows, hdr, map });
  renderXl();
}
function xlClasses(){
  const { rows, hdr, map, strip } = xl, out = [], seen = new Set(), books = {};
  let lastT = '', lastL = '';
  for(const r of rows.slice(hdr+1)){
    // 병합된 칸(위 줄과 같은 담임·레벨)은 비어 있어서 위 값을 이어받음
    let t = map.teacher>=0 ? r[map.teacher] : ''; if(!t) t = lastT; else lastT = t;
    let l = map.level>=0 ? r[map.level] : '';     if(!l && r.some(Boolean)) l = lastL; else if(l) lastL = l;
    if(strip) l = l.replace(/\s*[\(\[（].*?[\)\]）]\s*/g,'').trim();
    let s = map.slot>=0 ? r[map.slot] : '';
    if(map.slot2>=0 && r[map.slot2]) s = (s + r[map.slot2]).replace(/\s+/g,'');
    if(!t || !l || XL_GUESS.teacher.test(t)) continue;
    const key = t+'|'+l+'|'+s;
    if(!seen.has(key)){ seen.add(key); out.push({teacher:t, level:l, timeslot:s}); }
    if(map.book>=0 && r[map.book] && !books[l]) books[l] = r[map.book];
  }
  return { list: out, books };
}
function renderXl(){
  const head = xl.rows[xl.hdr] || [];
  const colOpts = sel => `<option value="-1">(없음)</option>` + head.map((c,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(c||('열 '+(i+1)))}</option>`).join('');
  const { list } = xlClasses();
  $('sem_excel').innerHTML = `<div class="upload-box" style="margin-top:8px">
    <b>엑셀에서 어느 칸이 무엇인지 확인해 주세요</b>
    <div class="form" style="grid-template-columns:80px 1fr 80px 1fr;margin-top:6px">
      ${xl.wb.SheetNames.length>1?`<label>시트</label><select onchange="xl.sheet=this.value;loadXlSheet()" style="grid-column:span 3">${xl.wb.SheetNames.map(n=>`<option ${n===xl.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}
      <label>담임</label><select onchange="xl.map.teacher=+this.value;renderXl()">${colOpts(xl.map.teacher)}</select>
      <label>레벨</label><select onchange="xl.map.level=+this.value;renderXl()">${colOpts(xl.map.level)}</select>
      <label>시간대</label><select onchange="xl.map.slot=+this.value;renderXl()">${colOpts(xl.map.slot)}</select>
      <label>교시<br><span class="hint">(시간대 뒤에 붙임)</span></label><select onchange="xl.map.slot2=+this.value;renderXl()">${colOpts(xl.map.slot2)}</select>
      <label>문법교재</label><select onchange="xl.map.book=+this.value;renderXl()">${colOpts(xl.map.book)}</select>
      <label></label><label style="display:flex;gap:4px;align-items:center"><input type="checkbox" ${xl.strip?'checked':''} onchange="xl.strip=this.checked;renderXl()" style="width:auto"> 레벨에서 괄호 빼기 <span class="hint" style="margin:0">MA1(1-3개월)→MA1</span></label>
    </div>
    <div class="hint">반 ${list.length}개 인식 · 미리보기: ${list.slice(0,6).map(c=>`${esc(c.teacher)} · ${esc(c.level)} · ${esc(c.timeslot||'-')}`).join(' / ')}${list.length>6?' …':''}</div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="sm primary" ${list.length?'':'disabled'} onclick="applyXl(true)">반 목록 바꾸기</button>
      <button class="sm" ${list.length?'':'disabled'} onclick="applyXl(false)">기존 목록에 더하기</button>
      <button class="sm" onclick="xl=null;$('sem_excel').innerHTML=''">취소</button>
    </div>
  </div>`;
}
function applyXl(replace){
  const { list, books } = xlClasses();
  const base = replace ? [] : draft.classes.filter(c=>c.teacher.trim()||c.level.trim());
  const seen = new Set(base.map(c=>c.teacher+'|'+c.level+'|'+c.timeslot));
  for(const c of list){ const k=c.teacher+'|'+c.level+'|'+c.timeslot; if(!seen.has(k)){ seen.add(k); base.push(c); } }
  draft.classes = base.sort((a,b)=>a.teacher.localeCompare(b.teacher)||a.level.localeCompare(b.level)||a.timeslot.localeCompare(b.timeslot));
  for(const [l,b] of Object.entries(books)) if(!draft.books[l]) draft.books[l]=b;
  xl = null; renderSemModal(); toast(`반 ${list.length}개 불러왔어요. 확인 후 저장을 눌러주세요`);
}

function toggleSemPaste(){ const b=$('sem_paste'); b.style.display = b.style.display==='none' ? 'block' : 'none'; }
function applySemPaste(){
  let n=0;
  for(const line of $('sem_paste_text').value.split(/\r?\n/)){
    const [t,l,s,bk]=line.split('\t').map(x=>(x||'').replace(/​/g,'').trim());
    if(!t || !l || t==='담임') continue;
    draft.classes.push({teacher:t, level:l, timeslot:s||''});
    if(bk && !draft.books[l]) draft.books[l]=bk;
    n++;
  }
  draft.classes = draft.classes.filter(c=>c.teacher.trim()||c.level.trim());
  renderSemModal(); toast(`${n}줄 추가했어요`);
}

  draft.classes = classes.filter(c=>c.semester_id===src).map(c=>({teacher:c.teacher, level:c.level, timeslot:c.timeslot}));
  draft.books = Object.fromEntries(levelBooks.filter(b=>b.semester_id===src).map(b=>[b.level,b.book]));

async function saveSemester(){
  const d=draft;
  if(!d.name.trim() || !d.start || !d.end) return toast('학기 이름과 기간을 입력해 주세요', true);
  if(d.start > d.end) return toast('종료일이 시작일보다 빨라요', true);
  const cls=d.classes.map(c=>({teacher:c.teacher.trim(), level:c.level.trim(), timeslot:c.timeslot.trim()})).filter(c=>c.teacher&&c.level);

}

// 교재 목록 붙여넣기: 'DSC1_01.Goldilocks…' → 'Goldilocks…' (레벨·번호 떼기)
function cleanBookTitle(s){
  return String(s||'').replace(/​/g,'')
    .replace(/^[A-Za-z]{2,4}\d?\s*_\s*(\d+\s*[._]\s*)?/, '')
    .replace(/[′’‘`]/g, "'").replace(/\s+/g,' ').trim();
}
function openAddBooks(){
  showModal(`
    <h2>📋 ${CAT_LABEL[tab]} 교재 여러 개 붙여넣기</h2>
    <div class="desc">엑셀에서 교재 칸을 복사해서 붙여넣으세요. 앞의 레벨·번호(예: <b>DSC1_01.</b>)는 떼고 제목만 올라가고, <b>레벨(DSC1)은 따로 저장</b>돼서 신청할 때 그 레벨 교재만 보여요.<br>이미 올린 교재도 다시 붙여넣으면 레벨만 채워져요.</div>
    <textarea id="ab_text" rows="10" oninput="previewBooks()" placeholder="DSC1_01.Goldilocks and the Three Bears&#10;DSC1_02.The Frog Prince"></textarea>
    <div class="hint" id="ab_prev"></div>
    <div class="btns"><button onclick="openLibrary()">뒤로</button><button class="primary" onclick="saveBooks()">올리기</button></div>`, true);
}
// 'DSC1_01.Goldilocks' → {book:'Goldilocks', level:'DSC1'}
function bookItems(){
  const out = new Map();
  for(const line of $('ab_text').value.split(/\r?\n/)){
    const raw = line.replace(/\u200b/g,'').trim(); if(!raw) continue;
    const m = raw.match(/^([A-Za-z]{2,4}\d?)\s*_/);
    const book = cleanBookTitle(raw); if(!book) continue;
    const level = m ? m[1].toUpperCase() : (out.get(book)||{}).level || '';
    out.set(book, { book, level });
  }
  return [...out.values()];
}
function bookList(){ return bookItems().map(x=>x.book); }
function previewBooks(){
  const l = bookList(), have = new Set(libBooks(tab));
  const nw = l.filter(b=>!have.has(b));
  const it = bookItems();
  $('ab_prev').innerHTML = l.length ? `${l.length}개 인식 · 새로 추가 ${nw.length}개 · 레벨 있음 ${it.filter(x=>x.level).length}개<br>${it.slice(0,8).map(x=>esc(x.book)+(x.level?` <span class="file has">${esc(x.level)}</span>`:'')).join(' / ')}${l.length>8?' …':''}` : '';
}
async function saveBooks(){
  const l = bookList();
  if(!l.length) return toast('교재를 붙여넣어 주세요', true);
  const items = bookItems();
  const { data, error } = await sb.rpc('exam_lib_add_books', {p_pw:adminPw, p_category:tab, p_books:items.map(x=>x.book), p_levels:items.map(x=>x.level||null)});
  if(error) return toast('올리기 실패: '+errMsg(error), true);
  const lv = items.filter(x=>x.level).length;
  toast(`교재 ${l.length}개 저장${lv?` · 레벨 ${lv}개 연결`:''}`);
  await loadLibrary(); openLibrary('');
}
function fillLessonRange(){
  const p=$('al_pre').value, a=parseInt($('al_from').value,10), b=parseInt($('al_to').value,10), pair=$('al_pair').checked;
  if(!(a<=b) || b-a>200) return toast('범위를 확인해 주세요', true);
  const out=[];
  if(pair) for(let i=a;i<=b;i+=2) out.push(i+1<=b ? `${p}${i}-${i+1}` : `${p}${i}`);
  else for(let i=a;i<=b;i++) out.push(p+i);
  $('al_lessons').value = out.join('\n');
}
async function saveLessons(){
  const book=$('al_book').value.trim();
  const lessons=$('al_lessons').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!book) return toast('교재 이름을 입력해 주세요', true);
  if(!lessons.length) return toast('레슨을 입력해 주세요', true);
  const { data, error } = await sb.rpc('exam_lib_add_lessons', {p_pw:adminPw, p_category:tab, p_book:book, p_lessons:lessons});
  if(error) return toast('추가 실패: '+errMsg(error), true);
  toast(`${data}개 레슨 추가${data<lessons.length?' (이미 있는 건 건너뜀)':''}`);
  await loadLibrary(); openLibrary(book);
}

// ---------- 여러 파일 한 번에 올리기 ----------
let bulk = [];   // {file, book, key('id' | 'new'), newName, kind('main'|'retest'|'skip'), msg}
const normName = s => String(s||'').toLowerCase().replace(/\.pdf$/,'').replace(/[^a-z0-9가-힣]/g,'');   // 띄어쓰기·따옴표·기호 무시
// 'Chapter 5-6', 'Ch56', 'Unit 1-2', 'L13-14' → 숫자 배열
function nums(s, needPrefix){
  const m = String(s).match(/(?:chapter|ch|lesson|les|unit|u|l)[\s._\-]*(\d[\d\s,\-~&_.+]*)/i);
  if(m) return m[1].match(/\d+/g).map(Number);
  if(needPrefix) return null;
  const all = String(s).match(/\d+/g); return all ? all.map(Number) : null;
}
function sameNums(f, l){
  if(!f || !l) return false;
  if(f.join(',')===l.join(',')) return true;
  return f.length===1 && l.length>1 && String(f[0])===l.join('');      // Ch56 = Chapter 5-6
}
function guessBook(name){
  const n = normName(name);
  const hit = allBooks(tab).filter(b=>normName(b) && n.includes(normName(b))).sort((a,b)=>normName(b).length-normName(a).length);
  return hit[0] || libFilter || '';
}
function guessLesson(name, book){
  if(BOOK_ONLY(tab)) return { key:'book', newName:'' };
  const f = nums(name, true);
  const l = libLessons(tab, book).find(x=>sameNums(f, nums(x.lesson)));
  if(l) return { key:String(l.id), newName:'' };
  if(!f) return { key:'', newName:'' };
  // 새 레슨 이름: 같은 교재의 기존 레슨 모양을 따라감
  let pair = f;
  if(f.length===1 && f[0]>=10 && f[0]<100){ const a=Math.floor(f[0]/10), b=f[0]%10; if(b===a+1) pair=[a,b]; }   // 56 → 5-6
  const sample = libLessons(tab, book)[0];
  const pre = sample ? (sample.lesson.match(/^\D*/)[0] || '') : 'Chapter ';
  return { key:'new', newName: pre + pair.join('-') };
}
const guessKind = name => /재시|재시험|retest|2차/i.test(name) ? 'retest' : 'main';

      파일 이름에 <b>재시·2차</b>가 있으면 재시험지, 없으면 본시험지로 봐요.</div>

function addBulkFiles(files){
  for(const f of files){
    if(!/\.pdf$/i.test(f.name) && f.type!=='application/pdf') continue;
    let book = guessBook(f.name); const g = guessLesson(f.name, book);
    const r = { file:f, book, key:g.key, newName:g.newName, kind:guessKind(f.name), msg:'', newBook:'' };
    if(BOOK_ONLY(tab) && !book.includes(COMBO_SEP)){
      // 파일 이름에 책 제목이 두 개 있으면 → 두 권 묶기 자동 선택 (파일 이름에 나온 순서대로)
      const n = normName(f.name);
      const two = singleBooks().filter(b=>normName(b) && n.includes(normName(b)))
        .sort((a,b)=>n.indexOf(normName(a))-n.indexOf(normName(b)));
      if(two.length >= 2){ r.book='__combo'; r.ca=two[0]; r.cb=two[1]; }
      else if(!book){ r.book='__new'; r.newBook=titleFromFile(f.name); }
    }
    bulk.push(r);
  }
  renderBulk();
}
// 파일 이름 → 교재 이름 후보 (CHAT 새 교재용)
function titleFromFile(n){
  return cleanBookTitle(String(n).replace(/\.pdf$/i,'').replace(/[_]+/g,' ')
    .replace(/\b(chat|test|본시험지?|재시험지?|재시|[12]차)\b/gi,'').replace(/\s+/g,' '));
}
function bulkSetBook(i, v){ const r=bulk[i]; r.book=v; if(v==='__new' && !r.newBook) r.newBook=titleFromFile(r.file.name); Object.assign(r, guessLesson(r.file.name, v)); renderBulk(); }
// CHAT 줄의 실제 교재 이름 (새 교재 / 두 권 묶기 포함)
function bulkBookName(r){
  if(r.book==='__new') return (r.newBook||'').trim();
  if(r.book==='__combo') return r.ca && r.cb && r.ca!==r.cb ? r.ca+COMBO_SEP+r.cb : '';
  return r.book;
}
function bulkSetAllBooks(v){ if(!v) return; bulk.forEach((r,i)=>{ r.book=v; Object.assign(r, guessLesson(r.file.name, v)); }); renderBulk(); }
function renderBulk(){
  const books = allBooks(tab);
  const chat = BOOK_ONLY(tab);
  const bookName = bulkBookName;
  const target = r => chat ? bookName(r)+'|'+r.kind : r.key==='new' ? r.book+'|'+r.newName.trim()+'|'+r.kind : r.key+'|'+r.kind;
  const count = {}; bulk.forEach(r=>{ if(r.kind!=='skip') count[target(r)]=(count[target(r)]||0)+1; });
  const ready = bulk.filter(r=>bulkReady(r)).length;
  $('bulk_area').innerHTML = bulk.length ? `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <span class="hint" style="margin:0">교재 한 번에 바꾸기:</span>
      <select onchange="bulkSetAllBooks(this.value)" style="font-size:12px;padding:4px"><option value="">선택</option>${books.map(b=>`<option>${esc(b)}</option>`).join('')}</select>
      <span class="spacer"></span><span class="hint" style="margin:0">${bulk.length}개 중 ${ready}개 준비됨</span>
    </div>
    <table class="sem-table bulk-table">
      <tr><th>파일</th><th style="width:${chat?40:26}%">교재</th>${chat?'':'<th style="width:26%">Chapter/Lesson</th>'}<th style="width:13%">종류</th><th style="width:12%"></th></tr>
      ${bulk.map((r,i)=>{
        const ls = libLessons(tab, r.book);
        const dup = r.kind!=='skip' && count[target(r)]>1;
        return `<tr>
          <td title="${esc(r.file.name)}" style="word-break:break-all">${esc(r.file.name)}</td>
          <td><select onchange="bulkSetBook(${i},this.value)"><option value="">교재 선택</option>${[...new Set([r.book,...books])].filter(Boolean).map(b=>`<option ${b===r.book?'selected':''}>${esc(b)}</option>`).join('')}${chat?`<option value="__combo" ${r.book==='__combo'?'selected':''}>🔗 두 권 묶기</option><option value="__new" ${r.book==='__new'?'selected':''}>＋ 새 교재</option>`:''}</select>
              ${chat && r.book==='__combo'?`<div style="display:flex;flex-direction:column;gap:3px;margin-top:3px">${bookPickHTML('bk_a'+i, r.ca, `bulk[${i}].ca=this.value;renderBulk()`)}${bookPickHTML('bk_b'+i, r.cb, `bulk[${i}].cb=this.value;renderBulk()`)}</div>`:''}
              ${chat && r.book==='__new'?`<input value="${esc(r.newBook)}" oninput="bulk[${i}].newBook=this.value" onchange="renderBulk()" placeholder="새 교재(시험) 이름" style="margin-top:3px">`:''}</td>
          ${chat?'':`<td><select onchange="bulk[${i}].key=this.value;renderBulk()" ${r.book?'':'disabled'}>
                <option value="">선택</option>${ls.map(l=>`<option value="${l.id}" ${String(l.id)===r.key?'selected':''}>${esc(l.lesson)}${(r.kind==='main'?l.main_file:l.retest_file)?' (교체)':''}</option>`).join('')}
                <option value="new" ${r.key==='new'?'selected':''}>＋ 새 레슨</option></select>
              ${r.key==='new'?`<input value="${esc(r.newName)}" oninput="bulk[${i}].newName=this.value" onchange="renderBulk()" placeholder="새 레슨 이름" style="margin-top:3px">`:''}</td>`}
          <td><select onchange="bulk[${i}].kind=this.value;renderBulk()">
                <option value="main" ${r.kind==='main'?'selected':''}>본시험지</option>
                <option value="retest" ${r.kind==='retest'?'selected':''}>재시험지</option>
                <option value="skip" ${r.kind==='skip'?'selected':''}>빼기</option></select></td>
          <td>${r.msg || (dup?'<span style="color:var(--red)">겹침</span>':'')}</td>
        </tr>`;
      }).join('')}
    </table>` : '';
  $('bulk_go').disabled = !ready;
}
function bulkReady(r){
  if(r.kind==='skip' || !r.book) return false;
  if(BOOK_ONLY(tab)) return !!bulkBookName(r);
  return !!r.key && (r.key!=='new' || !!r.newName.trim());
}
async function runBulk(){
  const go = $('bulk_go'); go.disabled = true;
  const rows = bulk.filter(bulkReady);
  if(BOOK_ONLY(tab)){
    // CHAT: 교재(시험) 자리 먼저 만들기 (이미 있으면 건너뜀)
    const lvOf = {}; rows.forEach(r=>{ const n=bulkBookName(r); if(r.book==='__combo') lvOf[n]=comboLevel(r.ca, r.cb); });
    const names = [...new Set(rows.map(bulkBookName))];
    const { error } = await sb.rpc('exam_lib_add_books', {p_pw:adminPw, p_category:tab, p_books:names, p_levels:names.map(n=>lvOf[n]||null)});
    if(error){ go.disabled=false; return toast('교재 만들기 실패: '+errMsg(error), true); }
    rows.forEach(r=>{ r.book = bulkBookName(r); });
  }
  // 1) 새 레슨 먼저 만들기 (교재별로)
  const add = {};
  rows.filter(r=>r.key==='new').forEach(r=>{ (add[r.book] = add[r.book] || []).push(r.newName.trim()); });
  for(const [book, ls] of Object.entries(add)){
    const { error } = await sb.rpc('exam_lib_add_lessons', {p_pw:adminPw, p_category:tab, p_book:book, p_lessons:[...new Set(ls)]});
    if(error){ go.disabled=false; return toast('레슨 만들기 실패: '+errMsg(error), true); }
  }
  await loadLibrary();
  // 2) 파일 하나씩 올리기
  let ok = 0;
  for(const r of rows){
    const lib = BOOK_ONLY(tab) ? bookRow(tab, r.book) : r.key==='new' ? libFind(tab, r.book, r.newName.trim()) : libById(Number(r.key));
    if(!lib){ r.msg = '<span style="color:var(--red)">레슨 없음</span>'; continue; }
    r.msg = '올리는 중…'; renderBulk(); $('bulk_go').disabled = true;
    try{
      if(r.file.size > 8*1024*1024) throw new Error('8MB 넘음');
      const bytes = await unlockPdf(new Uint8Array(await r.file.arrayBuffer()));
      const { error } = await sb.rpc('exam_lib_upload', {p_pw:adminPw, p_lib:lib.id, p_kind:r.kind, p_name:r.file.name, p_b64:bytesToB64(bytes)});
      if(error) throw error;
      r.msg = '<span style="color:var(--green)">✅</span>'; r.kind = 'skip'; ok++;
    }catch(e){ r.msg = `<span style="color:var(--red)" title="${esc(errMsg(e))}">${/잠긴/.test(errMsg(e))?'잠김·비번 확인':'실패'}</span>`; }
    renderBulk(); $('bulk_go').disabled = true;
  }
  await loadLibrary(); renderBulk();
  toast(`${ok}개 올렸어요${ok<rows.length?` · ${rows.length-ok}개 실패`:''}`, ok<rows.length);
}

      <div class="hint">B5 용지는 가로 182mm × 세로 257mm예요. 테스트 인쇄로 위치를 확인한 뒤 숫자를 조금씩 조정하세요.</div>
    </div>
    <div class="hint">📎 파일을 고르면 바로 올라가요. 🔒 본시험지는 관리자 비번, 재시험지는 조교 비번이 있어야만 열려요.</div>
    <div class="btns">
      <button class="danger" onclick="deleteLib(${id})" style="margin-right:auto">${l.lesson===''?'교재 삭제':'레슨 삭제'}</button>
      <button onclick="openLibrary(${jsq(l.book)})">보관함</button>
      <button onclick="renameLib(${id})">이름 저장</button>
      <button onclick="closeModal()">닫기</button>
    </div>`, true);
}
// 잠긴 PDF면 비번으로 풀어서 올림 (비번은 이 창을 닫기 전까지만 기억)
let pdfPw = '';
async function unlockPdf(bytes){
  const { PDFDocument } = PDFLib;
  try{ await PDFDocument.load(bytes); return bytes; }                 // 안 잠긴 파일
  catch(e){ if(!/encrypt/i.test(errMsg(e))) throw new Error('PDF를 읽을 수 없어요: '+errMsg(e)); }
  const typed = ($('li_pdfpw') && $('li_pdfpw').value) || '';
  for(const pw of [typed, pdfPw, '']){
    try{
      const src = await PDFDocument.load(bytes, { password: pw });
      const out = await PDFDocument.create();
      (await out.copyPages(src, src.getPageIndices())).forEach(p=>out.addPage(p));
      if(pw) pdfPw = pw;
      return await out.save();
    }catch(e){}
  }
  throw new Error('잠긴 PDF예요. 위의 "PDF 잠금 비번" 칸에 비번을 넣고 다시 눌러주세요');
}
async function uploadLibFile(id, kind){
  const f = $(kind==='main'?'u_main':'u_retest').files[0];
  if(!f) return toast('PDF 파일을 선택해 주세요', true);
  if(f.type!=='application/pdf' && !/\.pdf$/i.test(f.name)) return toast('PDF만 등록할 수 있어요', true);
  if(f.size > 8*1024*1024) return toast('8MB 이하 PDF만 올릴 수 있어요', true);
  let bytes;
  try{ bytes = await unlockPdf(new Uint8Array(await f.arrayBuffer())); }
  catch(e){ return toast(errMsg(e), true); }
  toast('올리는 중…');
  const b64 = bytesToB64(bytes);
  const { error } = await sb.rpc('exam_lib_upload', {p_pw:adminPw, p_lib:id, p_kind:kind, p_name:f.name, p_b64:b64});
  if(error) return toast('업로드 실패: '+errMsg(error), true);
  toast(kind==='main'?'본시험지 등록 완료':'재시험지 등록 완료');
  await loadLibrary(); openLibItem(id);
}
async function unlinkLibFile(id, kind){
  if(!confirm(`${kind==='main'?'본':'재'}시험지 파일을 지울까요?`)) return;
  const { error } = await sb.rpc('exam_lib_remove_file', {p_pw:adminPw, p_lib:id, p_kind:kind});
  if(error) return toast('실패: '+errMsg(error), true);
  await loadLibrary(); openLibItem(id);
}
async function saveLevel(id){
  const { error } = await sb.rpc('exam_lib_set_level', {p_pw:adminPw, p_lib:id, p_level:$('li_level').value});
  if(error) return toast('저장 실패: '+errMsg(error), true);
  toast('레벨 저장'); await loadLibrary(); openLibItem(id);
}
async function renameLib(id){
  const book=$('li_book').value.trim(), lesson=$('li_lesson').value.trim();
  if(!book || (!lesson && libById(id).lesson!=='')) return toast('교재와 레슨을 입력해 주세요', true);
  const { error } = await sb.rpc('exam_lib_rename', {p_pw:adminPw, p_lib:id, p_book:book, p_lesson:lesson});
  if(error) return toast('저장 실패: '+(/duplicate|unique/i.test(errMsg(error))?'같은 교재·레슨이 이미 있어요':errMsg(error)), true);
  toast('이름 저장 (연결된 신청 기록도 같이 바뀌어요)');
  await loadLibrary(); loadPapers(); openLibItem(id);
}
async function deleteLib(id){
  if(!confirm(`이 ${libById(id).lesson===''?'교재':'레슨'}을 보관함에서 삭제할까요? 신청 기록은 남고 시험지 연결만 끊겨요.`)) return;
  const book = libById(id).book;
  const { error } = await sb.rpc('exam_lib_delete', {p_pw:adminPw, p_lib:id});
  if(error) return toast('삭제 실패: '+errMsg(error), true);
  toast('삭제했어요'); await loadLibrary(); loadPapers(); openLibrary(libBooks(tab).includes(book)?book:'');
}
async function saveNamePos(id){
  const { error } = await sb.rpc('exam_lib_set_name_pos', {p_pw:adminPw, p_lib:id, p_x:Number($('n_x').value), p_y:Number($('n_y').value), p_size:Number($('n_s').value)});
  if(error){ toast('저장 실패: '+errMsg(error), true); return false; }
  toast('위치 저장'); await loadLibrary(); return true;
}
// 이름 위치 확인: '홍길동' 찍힌 재시험지 1부를 인쇄창으로
async function testPrint(id){
  if(!(await saveNamePos(id))) return;
  const { data, error } = await sb.rpc('exam_get_retest', {p_pw:adminPw, p_lib:id});
  if(error) return toast('불러오기 실패: '+errMsg(error), true);
  try{ printPdf(await buildPdf(b64ToBytes(data), ['홍길동'], libPos(libById(id)))); }
  catch(e){ toast('PDF 만들기 실패: '+errMsg(e), true); }
}

// 본시험지 인쇄 (관리자)
function openPrint(id){
  const p = papers.find(x=>x.id===id);
  const c = parseCopies(p.headcount) || '';
  showModal(`
    <h2>본시험지 인쇄</h2>
    <div class="desc">${esc(p.exam_date)} · ${esc(p.teacher)} · ${esc(p.level)} · ${esc(p.book)} ${esc(p.lesson)}</div>
    <div class="form"><label>부수</label><input type="number" id="p_copies" min="1" max="200" value="${c}"></div>
    <div class="hint">신청 인원 ${esc(p.headcount||'-')} 기준이에요. 부수만큼 합쳐서 인쇄창이 열리니, 인쇄창에서는 <b>매수 1</b> 그대로 두고 <b>용지 B5 · 양면</b>만 확인하세요.</div>
    <div class="btns"><button onclick="closeModal()">취소</button><button class="primary" id="p_go" onclick="sendPrint(${id})">🖨 인쇄창 열기</button></div>`);
}
async function sendPrint(id){
  const n = parseInt($('p_copies').value,10);
  if(!(n>=1 && n<=200)) return toast('부수를 확인해 주세요', true);
  const p = papers.find(x=>x.id===id), lib = libById(p.library_id);
  if(!lib || !lib.main_file) return toast('보관함에 본시험지가 없어요', true);
  $('p_go').disabled = true; toast('시험지 준비 중…');
  const { data, error } = await sb.rpc('exam_get_main', {p_pw:adminPw, p_lib:lib.id});
  if(error){ $('p_go').disabled=false; return toast('불러오기 실패: '+errMsg(error), true); }
  try{
    printPdf(await buildPdf(b64ToBytes(data), Array(n).fill(null), libPos(lib)));
  }catch(e){ $('p_go').disabled=false; return toast('PDF 만들기 실패: '+errMsg(e), true); }
  // 인쇄창은 끝났는지 알 수 없어서, 인쇄 후 직접 '준비완료' 누르기
  showModal(`
    <h2>인쇄창이 열렸어요</h2>
    <div class="desc">${esc(p.teacher)} · ${esc(p.level)} · ${esc(p.book)} ${esc(p.lesson)} — ${n}부</div>
    <div class="hint">인쇄를 마쳤으면 '준비완료로 표시'를 눌러주세요.</div>
    <div class="btns"><button onclick="closeModal()">나중에</button><button class="primary" onclick="markReady(${id})">✅ 준비완료로 표시</button></div>`);
}
async function markReady(id){
  const { error } = await sb.from('exam_papers').update({status:'준비완료', updated_at:new Date().toISOString()}).eq('id',id);
  if(error) return toast('변경 실패: '+errMsg(error), true);
  closeModal(); toast('준비완료'); loadPapers();
}

// 구글 시트에서 복사-붙여넣기로 기존 기록 옮기기
function openImport(){
  showModal(`
    <h2>${CAT_LABEL[tab]} 시트에서 붙여넣기</h2>
    <div class="desc">구글 시트에서 날짜~기타 참조 칸을 드래그해서 복사(Ctrl+C) 후 아래에 붙여넣으세요. 머리글 줄은 자동으로 건너뛰어요.</div>
    <textarea id="i_text" rows="10" placeholder="2026-10-26	Rachel	LSB1	..." oninput="previewImport()"></textarea>
    <div class="hint" id="i_prev"></div>
    <div class="btns"><button onclick="closeModal()">취소</button><button class="primary" onclick="doImport()">${CAT_LABEL[tab]} 탭에 추가</button></div>`, true);
}
function parseImport(text){
  const out=[];
  for(const line of text.split(/\r?\n/)){
    const cells=line.split('\t');
    const i=cells.findIndex(c=>/^\s*\d{4}-\d{1,2}-\d{1,2}\s*$/.test(c));
    if(i<0) continue;
    const c=cells.slice(i).map(s=>(s||'').replace(/\u200b/g,'').trim());
    const [y,m,d]=c[0].split('-');
    const st = STATUSES.includes(c[7]) ? c[7] : '신청';
    const lib = libFor(tab, c[3]||'', c[4]||'');
    out.push({category:tab, exam_date:`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`, teacher:c[1]||'', level:c[2]||'', book:c[3]||'', lesson:c[4]||'', library_id: lib?lib.id:null, timeslot:c[5]||'', headcount:c[6]||'', status:st, note:c[8]||''});
  }
  return out;
}
function previewImport(){ const r=parseImport($('i_text').value); $('i_prev').textContent = r.length ? `${r.length}줄 인식됨 (첫 줄: ${r[0].exam_date} ${r[0].teacher} ${r[0].level} ${r[0].book})` : ''; }
async function doImport(){
  const rows=parseImport($('i_text').value);
  if(!rows.length) return toast('인식된 줄이 없어요', true);
  const { error } = await sb.from('exam_papers').insert(rows);
  if(error) return toast('추가 실패: '+errMsg(error), true);
  closeModal(); toast(`${rows.length}줄 추가했어요`); loadPapers();
}

setTab('munin');
loadSettings(); loadLibrary(); loadPapers(); loadColors();
setInterval(()=>{ if(!$('modalBg').classList.contains('show')) loadPapers(); }, 20000);
</script>
